version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_app_prod
    restart: always  
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/public/uploads/documents
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://sigca_user:${DB_PASSWORD}@db:5432/sigca
    depends_on:
      - db
    # En producción solemos usar 'start' en lugar de 'dev'
    command: npm run start

  db:
    image: postgres:16-alpine
    container_name: postgres_db_prod
    restart: always
    environment:
      - POSTGRES_USER=sigca_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=sigca
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: